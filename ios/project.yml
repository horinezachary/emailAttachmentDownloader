# XcodeGen spec for the Photo Frame iPhone app. Generate the Xcode project on a Mac with:
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open EADCompanion.xcodeproj
#
# Before running on a device, set your Apple Developer team below (or pick it in Xcode under Signing & Capabilities).
# If you change the bundle identifier prefix, also change appGroupID, keychainService and backgroundTaskID in
# Shared/AppConfig.swift, and the App Group / keychain group names in this file, so they all agree.

name: EADCompanion

options:
  bundleIdPrefix: dev.horine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  EADCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horine.ead
        PRODUCT_NAME: EADCompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Photo Frame
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Photo Frame uses the camera only to scan the pairing code shown by Email Attachment Downloader on your PC.
        CFBundleURLTypes:
          - CFBundleURLName: dev.horine.ead.pair
            CFBundleURLSchemes:
              - ead
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.horine.ead.send-queue
        KeychainAccessGroup: $(AppIdentifierPrefix)dev.horine.ead.shared
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.horine.ead
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.horine.ead.shared

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horine.ead.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Photo Frame
        KeychainAccessGroup: $(AppIdentifierPrefix)dev.horine.ead.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.horine.ead
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.horine.ead.shared

  # Logic tests. They compile the shared sources themselves, so they need no host app.
  EADCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horine.ead.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EADCompanion:
    build:
      targets:
        EADCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EADCompanionTests
